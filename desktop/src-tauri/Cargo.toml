[package]
name = "nibbi-desktop"
version = "0.8.0"
description = "Nibbi — your local agent companion"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-notification = "2"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Liquid Glass (NSGlassEffectView, macOS 26+) with an NSVisualEffectView fallback.
# Never configure `windowEffects` in tauri.conf.json: that is Tauri's only entry point
# into its own transitive window-vibrancy 0.6, and both versions register the same
# ObjC class name (NSVisualEffectViewTagged), which would abort if both ever ran.
window-vibrancy = "0.8"

[profile.release]
strip = true
lto = true
