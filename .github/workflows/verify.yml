name: verify
on:
  push:
    branches: [main, v2, staging]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-platform:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: command -v rg || brew install ripgrep
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run verify
        env: { CI: '1' }
      - run: node tools/github-workflow-verify.mjs
        env: { CI: '1' }
      - run: npm run test:fresh
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7
