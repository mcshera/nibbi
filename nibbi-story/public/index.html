<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe6">
  <title>Nibbi</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-state="idle">
  <canvas id="ink" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>

  <main>
    <span id="nibbiAnchor" aria-hidden="true"></span>

    <section id="result" class="result" aria-live="polite" hidden>
      <div class="result-head">
        <span>MADE WITH NIBBI</span>
        <button id="resetButton" type="button">Start over</button>
      </div>
      <p id="requestLine" class="request-line"></p>
      <article id="answer" class="answer"></article>
    </section>
  </main>

  <form id="composer" class="composer" autocomplete="off">
    <textarea id="prompt" rows="1" placeholder="Ask Nibbi to make something…" aria-label="Ask Nibbi to make something"></textarea>
    <button id="sendButton" class="send-button" type="submit" aria-label="Send">
      <svg class="send-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18V6M7 11l5-5 5 5"/></svg>
      <span class="stop-icon" aria-hidden="true"></span>
    </button>
  </form>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/marked.js"></script>
  <script src="nibbi.js"></script>
  <script src="app.js"></script>
</body>
</html>
