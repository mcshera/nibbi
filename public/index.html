<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nibbi</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f2efe8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nibbi">
<link rel="stylesheet" href="styles.css">
</head>
<body data-mode="idle" data-link="booting">
  <canvas id="ink" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>

  <nav id="project-rail" aria-label="Projects"></nav>
  <nav id="settings-rail" aria-label="Preferences"></nav>

  <section id="feed" class="feed" aria-label="conversation"></section>
  <div id="sr" class="sr" aria-live="polite"></div>

  <div id="chips" class="chips" aria-label="suggestions"></div>

  <form id="pill" class="pill" autocomplete="off">
    <div id="attach" class="attach" hidden></div>
    <textarea id="ask" rows="1" placeholder="Ask nibbi to build something..." aria-label="message nibbi" spellcheck="false"></textarea>
    <button id="mic" class="ico mic" type="button" aria-label="Hey Nibbi microphone" aria-pressed="false" aria-describedby="listen" aria-keyshortcuts="Alt+Space" title="Hey Nibbi is off — turn microphone on (⌥ Space)">
      <span class="mic-label">Hey Nibbi</span>
      <span class="mic-switch" aria-hidden="true"><span class="mic-thumb"></span></span>
    </button>
    <button id="send" class="send" type="submit" aria-label="send">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 14.5V3.5M9 3.5L4 8.5M9 3.5L14 8.5" stroke="#f5f2ea" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div id="listen" class="listen" role="status" aria-live="polite" hidden><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span class="heard">listening…</span></div>
  </form>

  <div id="agents" class="agents" aria-label="agents at work" hidden></div>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/marked.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="pocket-motion.js"></script>
  <script src="nibbi.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
