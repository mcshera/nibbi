<style>
/* shared mock scaffolding */
body[data-mode="talk"] .feed { opacity: 1; pointer-events: auto; }

.v2 .impression b { color: #4b2a4a; }

.v6a .sheet6 h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-4); }

const html = {
