<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nibbi · Original motion reference</title><link rel="icon" href="data:,"><style>body{margin:0;background:#f5f2ec;color:#252820;font:14px system-ui}canvas{position:fixed;inset:0;pointer-events:none}header{position:relative;z-index:1;padding:24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:15px;margin:0}button{font:inherit;padding:8px 14px;border:1px solid #ccc;border-radius:5px;background:#faf8f3}a{color:inherit}footer{position:fixed;bottom:24px;left:24px;max-width:480px;color:#727468;font-size:12px;line-height:1.6}</style></head><body><canvas id="ink"></canvas><canvas id="fx"></canvas><header><h1>Original Nibbi · unchanged engine</h1><button id="hop">Hop</button><button id="happy">Happy</button><a href="./">Back to the motion lab ↗</a></header><footer>This loads the current public/nibbi.js directly. Its existing reduced-motion gaps are documented in AUDIT.md. The experimental lab is separate.</footer><script src="../../public/nibbi.js"></script><script>window.nibbi=createNibbi({ink:document.querySelector('#ink'),fx:document.querySelector('#fx')});function layout(){nibbi.setTarget({x:innerWidth/2,y:innerHeight*.55,r:Math.min(120,innerWidth*.22,innerHeight*.2)})}layout();addEventListener('resize',layout);document.querySelector('#hop').onclick=()=>nibbi.hop();document.querySelector('#happy').onclick=()=>nibbi.setMood('happy');</script></body></html>
