<!doctype html><html><head><meta charset="utf-8"><title>round 5 technique test</title>
<style>body{margin:0;background:#f3f0ea}.hosts{display:flex;gap:12px;padding:12px;align-items:flex-start}</style></head>
<body><div class="hosts" id="hosts"></div>
<script type="module">
import { ACTION_IDS } from '../actions.mjs';
const id = new URLSearchParams(location.search).get('id');
const out = { id, checks: [], failures: [], errors: [], measures: {} };
addEventListener('error', e => out.errors.push(String(e.message)));
const fail = m => out.failures.push(m); const ok = m => out.checks.push(m);
async function snapshot(host) {
  const r = host.getBoundingClientRect(); const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(r.width)); c.height = Math.max(1, Math.round(r.height)); const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#f3f0ea'; ctx.fillRect(0, 0, c.width, c.height);
  for (const el of host.querySelectorAll('canvas, svg, img')) {
    const b = el.getBoundingClientRect(); const x = b.left - r.left, y = b.top - r.top;
    if (el.tagName === 'CANVAS' || el.tagName === 'IMG') ctx.drawImage(el, x, y, b.width, b.height);
    else { const svg = new XMLSerializer().serializeToString(el); const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('svg raster failed')); }); ctx.drawImage(img, x, y, b.width, b.height); }
  }
  const d = ctx.getImageData(0, 0, c.width, c.height); return { px: d.data, w: c.width, h: c.height };
}
const inkCount = s => { let n = 0; const px = s.px; for (let i = 0; i < px.length; i += 4) if (px[i] < 150 && px[i + 3] > 40) n++; return n; };
const diff = (a, b) => { let d = 0; const A = a.px, B = b.px; for (let i = 0; i < A.length; i += 4) d += Math.abs(A[i] - B[i]); return d / (A.length / 4) / 255; };
const centroid = s => { let sx = 0, sy = 0, n = 0; const px = s.px; for (let i = 0; i < px.length; i += 4) { const v = px[i]; if (v < 150) { const k = i / 4, x = k % s.w, y = (k - x) / s.w, w = (150 - v) / 150; sx += x * w; sy += y * w; n += w; } } return n ? { x: sx / n, y: sy / n } : { x: 0, y: 0 }; };
const run = (ctl, frames) => { for (let i = 0; i < frames; i++) ctl.step(1 / 60); };
try {
  const mod = await import(`./techniques/${id}.mjs`);
  const m = mod.meta; if (!m || m.id !== id) fail('meta.id must equal file name'); else ok(`meta ${m.name} · faculty: ${m.faculty}`);
  for (const k of ['name', 'faculty', 'technique', 'tagline', 'look', 'motion', 'eyes']) if (!m?.[k]) fail(`meta.${k} missing`);
  if (!Array.isArray(m?.risks) || !m.risks.length) fail('meta.risks empty');
  if (!Array.isArray(m?.thoughtful) || m.thoughtful.length < 3) fail('meta.thoughtful must list at least three behaviours');
  if (!m?.stills || ACTION_IDS.some(a => !(m.stills[a] > 0))) fail('meta.stills must give a positive seconds value for every action');
  const hosts = document.getElementById('hosts');
  const sizes = [{ size: 'hero', R: 96 }, { size: 'pill', R: 26 }, { size: 'tiny', R: 12 }];
  const inst = {};
  for (const s of sizes) { const host = document.createElement('div'); hosts.appendChild(host); const t0 = performance.now(); inst[s.size] = { host, ctl: mod.mount(host, { R: s.R, seed: 1, size: s.size }), R: s.R }; const dt = performance.now() - t0;
    const r = host.getBoundingClientRect(); if (Math.abs(r.width - 3.4 * s.R) > 2 || Math.abs(r.height - 3.6 * s.R) > 2) fail(`${s.size}: host must be 3.4R×3.6R, got ${r.width}×${r.height}`); if (dt > 6000) fail(`${s.size}: mount took ${dt.toFixed(0)}ms`); }
  ok('mounted at hero/pill/tiny');
  for (const k of ['cue', 'step', 'setReduced', 'setEnergy', 'setTint', 'destroy']) if (typeof inst.hero.ctl[k] !== 'function') fail(`controller.${k} missing`);
  // idle warm-up and cost
  let t0 = performance.now(); run(inst.hero.ctl, 120); const perFrame = (performance.now() - t0) / 120; ok(`hero step+draw ≈ ${perFrame.toFixed(2)} ms/frame`); if (perFrame > 8) fail(`hero step+draw too slow: ${perFrame.toFixed(1)} ms/frame (budget ~4)`);
  const idleS = await snapshot(inst.hero.host); if (inkCount(idleS) < 200) fail('hero idle draws (almost) no ink');
  run(inst.tiny.ctl, 60); const tinyS = await snapshot(inst.tiny.host); if (inkCount(tinyS) < 15) fail('tiny idle draws (almost) no ink');
  // calm: idle / listen / think / work drift over 2 s
  const calm = {}; const budget = { idle: .02, listen: .02, think: .025, work: .03 };
  for (const a of ['idle', 'listen', 'think', 'work']) { const { ctl, host } = inst.hero; ctl.cue(a); run(ctl, 150); const s1 = await snapshot(host); run(ctl, 120); const s2 = await snapshot(host); calm[a] = Number(diff(s1, s2).toFixed(4)); if (calm[a] > budget[a]) fail(`${a} fidgets: ${calm[a]} mean change over 2 s (keep ≤ ${budget[a]})`); }
  ok(`calm (mean change over 2 s): ${JSON.stringify(calm)}`); out.measures.calm = calm;
  // attention: listen's ink centroid sits left of idle's
  { const { ctl, host, R } = inst.hero; ctl.cue('idle'); run(ctl, 150); const ci = centroid(await snapshot(host)); ctl.cue('listen'); run(ctl, Math.round((m.stills?.listen ?? 1.2) * 60)); const cl = centroid(await snapshot(host)); const shift = (ci.x - cl.x) / R; out.measures.attentionShiftR = Number(shift.toFixed(3)); if (shift < .05) fail(`listen does not turn toward the person: centroid shift ${shift.toFixed(3)}R (need ≥ .05R to the left)`); else ok(`listen turns toward the person: centroid ${shift.toFixed(3)}R left of idle`); }
  // the beat: time until the first visible change after cue('hello')
  { const { ctl, host } = inst.hero; ctl.cue('idle'); run(ctl, 150); const base = await snapshot(host); ctl.cue('hello'); let beat = null; for (let f = 1; f <= 40; f++) { ctl.step(1 / 60); const d = diff(await snapshot(host), base); if (d > .004) { beat = Math.round(f * 1000 / 60); break; } } out.measures.beatMs = beat; ok(`beat before hello: ${beat === null ? '> 660 ms (nothing moved)' : beat + ' ms'}`); if (beat === null) fail('hello: nothing visible changed within 660 ms'); }
  // every moment renders, differs from idle at its still, and one-shots return to idle
  const cueTimes = {};
  for (const a of ACTION_IDS) {
    const { ctl, host } = inst.hero; ctl.cue('idle'); run(ctl, 90); const base = await snapshot(host);
    t0 = performance.now(); ctl.cue(a); const frames = Math.max(1, Math.round((m.stills?.[a] ?? .7) * 60)); run(ctl, frames); cueTimes[a] = (performance.now() - t0) / frames;
    const s = await snapshot(host); if (inkCount(s) < 200) fail(`${a}: draws (almost) no ink at its still`);
    if (a !== 'idle' && diff(s, base) < .004) fail(`${a}: still is identical to idle (mean diff ${diff(s, base).toFixed(4)})`);
    inst.tiny.ctl.cue(a); run(inst.tiny.ctl, frames); if (inkCount(await snapshot(inst.tiny.host)) < 10) fail(`${a}: tiny draws nothing`);
  }
  ok('all nine moments render at hero and tiny and differ from idle at their stills');
  for (const a of ['hello', 'tap', 'success', 'error']) { const { ctl, host } = inst.hero; ctl.cue('idle'); run(ctl, 120); const base = await snapshot(host); ctl.cue(a); run(ctl, 60 * 4); const after = await snapshot(host); const d = diff(after, base); if (d > .03) fail(`${a}: did not return to idle after 4 s (mean diff ${d.toFixed(3)})`); }
  ok('one-shots return to idle within 4 s');
  // reduced motion: frames become identical
  { const { ctl, host } = inst.hero; ctl.cue('think'); ctl.setReduced(true); run(ctl, 90); const a1 = await snapshot(host); run(ctl, 45); const a2 = await snapshot(host); const d = diff(a1, a2); if (d > 0) fail(`reduced motion still changes frames (mean diff ${d.toFixed(5)})`); else ok('reduced motion converges to identical frames');
    ctl.cue('success'); run(ctl, 90); const b1 = await snapshot(host); run(ctl, 30); const b2 = await snapshot(host); if (diff(b1, b2) > 0) fail('reduced motion: success does not settle to a still'); if (diff(a1, b1) < .004) fail('reduced motion: think and success stills are identical');
    ctl.cue('listen'); run(ctl, 90); const c1 = await snapshot(host); if (diff(a1, c1) < .004) fail('reduced motion: think and listen stills are identical'); ctl.setReduced(false); }
  // touch response
  { const { ctl, host, R } = inst.hero; ctl.cue('idle'); run(ctl, 120); const base = await snapshot(host); const x = 1.7 * R, y = 3.1 * R - .7 * R;
    ctl.poke(x, y, 'down'); run(ctl, 6); ctl.poke(x + 10, y + 12, 'move'); run(ctl, 6); ctl.poke(x + 10, y + 12, 'up');
    run(ctl, 10); const after = await snapshot(host); const d = diff(after, base); ok(`touch response change: ${d.toFixed(4)}`); if (d < .004) fail('body does not respond to a pointer press/drag'); }
  // tint
  { const { ctl, host } = inst.pill; ctl.setTint('#7a4b2a'); ctl.cue('idle'); run(ctl, 30); const s = await snapshot(host); let tinted = 0; const px = s.px; for (let i = 0; i < px.length; i += 4) if (px[i] > px[i + 2] + 25 && px[i] < 200) tinted++; if (tinted < 20) fail('setTint did not recolour the ink'); else ok('tint recolours the ink'); ctl.setTint(null); }
  // energy + destroy
  inst.hero.ctl.setEnergy(1.5); run(inst.hero.ctl, 10); for (const s of sizes) inst[s.size].ctl.destroy(); if (hosts.querySelector('canvas,svg')) fail('destroy() left DOM behind'); else ok('destroy cleans up');
  out.perf = { heroMsPerFrame: Number(perFrame.toFixed(2)), cueMsPerFrame: Object.fromEntries(Object.entries(cueTimes).map(([k, v]) => [k, Number(v.toFixed(2))])) };
} catch (e) { out.failures.push('exception: ' + (e.stack || e.message)); }
window.__result = out;
</script></body></html>
