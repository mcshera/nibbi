<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Oracle</title>
<script>
window.onerror=function(m,s,l,c){try{fetch("/api/beacon?stage=onerror&m="+encodeURIComponent(String(m)+" @"+l+":"+c))}catch(_){}};
try{fetch("/api/beacon?stage=head")}catch(e){}
</script>
<style>
  @font-face{font-family:Geist;src:url(/fonts/GeistVF.woff2) format("woff2");font-weight:100 900;font-display:swap}
  @font-face{font-family:"Geist Mono";src:url(/fonts/GeistMonoVF.woff2) format("woff2");font-weight:100 900;font-display:swap}
  :root{
    --bg:#0e0f13; --bg2:#12131a;
    --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.075);
    --stroke:rgba(255,255,255,.085); --stroke2:rgba(255,255,255,.14);
    --txt:#e8e9ec; --dim:#9a9ca4; --faint:#6b6d75;
    --acc:#9a8fb8; --acc-hi:#cfc9e6; --acc-soft:rgba(154,143,184,.38); --acc-tint:rgba(154,143,184,.12); --acc-glow:rgba(154,143,184,.22);
    --ok:#7ab88f; --ok-hi:#bfe6c4; --ok-soft:rgba(122,184,143,.4); --ok-tint:rgba(122,184,143,.1); --ok-glow:rgba(122,184,143,.2);
    --warn:#e0a35c; --warn-hi:#f0d9a8; --warn-soft:rgba(224,163,92,.4); --warn-tint:rgba(224,163,92,.1); --warn-glow:rgba(224,163,92,.22);
    --bad:#e07a6a; --bad-hi:#f0b6a8; --bad-soft:rgba(224,122,106,.4); --bad-tint:rgba(224,122,106,.08); --bad-glow:rgba(224,122,106,.22);
    --r-xs:6px; --r-sm:10px; --r:14px; --r-lg:18px; --r-pill:999px;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px;
    --blur:20px; --blur-sm:8px;
    --sh-1:var(--sh-1); --sh-2:var(--sh-2); --sh-3:var(--sh-3);
    --sans:Geist,-apple-system,"Helvetica Neue",sans-serif; --mono:"Geist Mono","SF Mono",ui-monospace,Menlo,monospace;
    --m1:.1s; --m2:.15s; --m3:.25s; --ease:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.55 var(--sans);height:100vh;overflow:hidden;display:grid;grid-template-columns:1fr 400px;grid-template-rows:auto 1fr;gap:14px;padding:12px 14px 14px}
  body.vibrant{background:rgba(14,15,19,.60)}
  body::before{content:"";position:fixed;inset:-30%;pointer-events:none;z-index:0;
    background:radial-gradient(38% 30% at 22% 18%,rgba(154,143,184,.075),transparent 60%),
               radial-gradient(34% 28% at 78% 72%,rgba(120,130,160,.06),transparent 60%);
    animation:drift 90s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate(3%,4%) scale(1.06)}}

  #ambient{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
  header{position:relative;z-index:2;grid-column:1;grid-row:1;display:flex;gap:14px;margin:0;user-select:none;align-items:stretch}
  .hbub{display:flex;align-items:center;gap:12px;padding:12px 16px;
    background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--stroke);border-radius:var(--r)}
  #hleft{flex:1;min-width:0}
  #hright{width:400px;flex:none}
  .hgrow{flex:1}
  #projbtn{padding:3px 10px;border-radius:var(--r-pill);border:1px solid var(--stroke);background:rgba(255,255,255,.04);
    color:var(--dim);font:9.5px var(--mono);letter-spacing:.14em;cursor:pointer}
  #projbtn:hover{color:var(--txt);border-color:var(--acc-soft);transform:none;box-shadow:none}
  #agentchip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:var(--r-pill);
    border:1px solid var(--ok-soft);background:var(--ok-tint);color:var(--ok-hi);
    font:9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;margin-right:10px}
  #agentchip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 8px var(--ok);animation:fxpulse 1.4s ease-in-out infinite}
  #agentchip:hover{border-color:var(--ok)}
  @media(max-width:900px){body{grid-template-columns:1fr}aside{display:none}}
  .word{font-weight:700;letter-spacing:.42em;font-size:14px;color:var(--txt);display:inline-flex}
  .word span{display:inline-block;will-change:transform;transition:color .5s}
  #stat{margin-left:auto;color:var(--dim);font-size:11.5px;white-space:nowrap;font-family:var(--mono)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin:0 0 0 14px;flex:none;transition:.4s}
  .dot.ok{background:var(--acc);box-shadow:0 0 8px var(--acc-soft);animation:presb 3s ease-in-out infinite}
  #brainbtn,#projbtn{padding:6px 14px;border-radius:var(--r-pill);font:10px var(--mono);letter-spacing:.14em;color:var(--dim)}
  #brainbtn:hover,#projbtn:hover{color:var(--txt);border-color:var(--stroke2)}

  main{position:relative;z-index:1;grid-column:1;grid-row:2;display:flex;min-height:0;padding:0}
  #chatcol{flex:1;display:flex;flex-direction:column;min-width:0;gap:10px;position:relative}
  #chat{flex:1;overflow-y:auto;padding:16px 18px;scroll-behavior:smooth;
    background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--stroke);border-radius:var(--r)}
  .msg{position:relative;max-width:76%;margin:0 0 12px;padding:10px 14px;border-radius:var(--r);
    white-space:pre-wrap;word-wrap:break-word;border:1px solid var(--stroke)}
  .msg.user{background:var(--panel2);margin-left:auto;border-bottom-right-radius:var(--r-xs)}
  .msg.oracle{background:var(--panel);border-bottom-left-radius:var(--r-xs)}
  .msg.oracle.arrive::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(110deg,transparent 20%,var(--acc-tint) 50%,transparent 80%);
    background-size:220% 100%;animation:sweep 1.6s ease-out 1}
  @keyframes sweep{from{background-position:180% 0}to{background-position:-60% 0}}
  .msg .meta{display:block;color:var(--faint);font-size:10px;margin-bottom:5px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--mono)}
  .msg .meta .pres{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--acc);box-shadow:0 0 6px var(--acc-glow);margin-right:6px;vertical-align:middle;animation:presb 3s ease-in-out infinite}
  @keyframes presb{0%,100%{opacity:.55}50%{opacity:1}}
  .msg.oracle .meta{color:var(--acc)}
  .md h1,.md h2,.md h3{color:var(--txt);font-size:13.5px;margin:8px 0 4px;letter-spacing:.04em}
  .md code{background:rgba(0,0,0,.35);border:1px solid var(--stroke);border-radius:var(--r-xs);padding:0 5px;color:var(--acc-hi);font-family:var(--mono);font-size:12.5px}
  .md pre{background:rgba(0,0,0,.35);border:1px solid var(--stroke);border-radius:var(--r-sm);padding:9px;overflow-x:auto;margin:6px 0;font-family:var(--mono);font-size:12px}
  .md a,.md .wiki{color:var(--acc);text-decoration:none}
  .md ul{padding-left:18px}.md li{margin:2px 0}
  .md input[type=checkbox]{-webkit-appearance:none;appearance:none;width:15px;height:15px;border:1px solid var(--stroke2);border-radius:var(--r-xs);background:var(--panel2);vertical-align:-2px;margin-right:8px;position:relative;flex:none;cursor:default;transition:border-color var(--m2),background var(--m2)}
  .md input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}
  .md input[type=checkbox]:checked::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
  .taskitem.todo{cursor:pointer;margin:2px -8px;padding:3px 8px;border-radius:var(--r-sm);transition:background var(--m2)}
  .taskitem.todo:hover{background:var(--acc-tint)}
  .taskitem.todo:hover>input[type=checkbox]{border-color:var(--acc-soft)}
  .md blockquote{border-left:2px solid var(--acc-soft);padding-left:10px;color:var(--dim);margin:6px 0}

  /* presence waveform — framed glass strip above the input (the AI's pulse) */
  #wavebar{position:relative;height:38px;flex:none;border-radius:var(--r);border:1px solid var(--stroke);
    background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.015));
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;
    box-shadow:inset 0 0 24px var(--acc-tint)}
  #wave{position:absolute;inset:0;width:100%;height:100%;display:block}
  #livestat{position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:1;pointer-events:none;padding:3px 12px 3px 26px;background:linear-gradient(90deg,transparent,var(--bg) 58%);
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-family:var(--mono);color:var(--faint);transition:color .5s}
  #livestat.hot{color:var(--acc)}
  /* code blocks — PULSE syntax theme (monochrome + violet) */
  .md pre{position:relative;background:rgba(0,0,0,.32);border:1px solid var(--stroke);border-radius:var(--r-sm);
    padding:12px 14px;overflow-x:auto;margin:10px 0}
  .md pre code{font:12px/1.6 var(--mono);background:none;padding:0;color:var(--acc-hi)}
  .md code{font:12.5px var(--mono);background:rgba(154,143,184,.09);border-radius:var(--r-xs);padding:1.5px 5px}
  .hljs-keyword,.hljs-tag,.hljs-name{color:var(--acc)}
  .hljs-string,.hljs-regexp{color:var(--ok-hi)}
  .hljs-comment,.hljs-meta{color:var(--faint);font-style:italic}
  .hljs-number,.hljs-literal,.hljs-built_in,.hljs-type{color:var(--acc-hi)}
  .hljs-title,.hljs-function,.hljs-attr{color:var(--acc-hi)}
  .hljs-addition{color:var(--ok-hi);background:rgba(120,200,120,.06)}
  .hljs-deletion{color:var(--bad-hi);background:rgba(200,120,120,.06)}
  .codecopy{position:absolute;top:7px;right:7px;padding:4px 9px;border-radius:var(--r-xs);border:1px solid var(--stroke);
    background:rgba(20,20,28,.85);color:var(--faint);font:9.5px var(--mono);letter-spacing:.1em;cursor:pointer;
    opacity:0;transition:.18s}
  .md pre:hover .codecopy{opacity:1}
  .codecopy:hover{color:var(--txt);border-color:var(--acc-soft)}
  #livestat.shimmer{background:linear-gradient(90deg,var(--faint) 25%,var(--acc-hi) 50%,var(--faint) 75%);
    background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shim 1.5s ease-in-out infinite alternate}
  @keyframes shim{0%{background-position:170% 0}100%{background-position:-70% 0}}
  #livestat.hot::after{content:"▮▮▮";margin-left:7px;letter-spacing:2px;animation:uplink 1s steps(4) infinite;opacity:.85}
  @keyframes uplink{0%{clip-path:inset(0 100% 0 0)}25%{clip-path:inset(0 66% 0 0)}50%{clip-path:inset(0 33% 0 0)}75%,100%{clip-path:inset(0 0 0 0)}}
  #think{display:none}

  #inputrow{display:flex;gap:10px;padding:10px 12px;align-items:flex-end;
    background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--stroke);border-radius:var(--r-lg)}
  @keyframes breathe{0%,100%{transform:scale(.86);opacity:.8}50%{transform:scale(1.06);opacity:1}}
  #box{flex:1;background:transparent;border:none;color:var(--txt);font:inherit;padding:8px 6px;resize:none;outline:none;max-height:140px}
  button{background:transparent;border:1px solid var(--stroke);color:var(--dim);border-radius:var(--r);padding:9px 16px;
    font:12px var(--mono);letter-spacing:.1em;cursor:pointer;
    transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .16s,border-color .18s,background .18s,color .18s}
  button:hover{color:var(--txt);border-color:var(--acc-soft);background:var(--acc-tint);
    transform:translateY(-1px);box-shadow:var(--sh-1),0 0 10px var(--acc-glow)}
  button:active{transform:translateY(1px) scale(.965);box-shadow:inset 0 2px 6px rgba(0,0,0,.45)}
  button:disabled{opacity:.35;cursor:default}
  #send{color:var(--acc-hi);background:var(--acc-tint);border-color:var(--acc-soft);font-weight:600;transition:background var(--m2),color var(--m2),box-shadow var(--m2),transform var(--m1)}
  #send:hover{background:var(--acc);color:var(--bg);border-color:var(--acc);box-shadow:0 0 16px var(--acc-glow)}
  #inputrow:focus-within{border-color:var(--acc-soft);box-shadow:0 0 0 3px var(--acc-glow)}
  #send:hover{background:rgba(154,143,184,.26)}
  #mic{width:auto;height:40px;flex:none}
  #mic.listening{color:var(--acc);border-color:var(--acc-soft);box-shadow:0 0 10px var(--acc-glow);animation:breathe 2.6s infinite}
  #mic.capturing{color:#fff;background:rgba(224,112,112,.25);border-color:rgba(224,112,112,.6);animation:breathe 1s infinite}
  #mic.thinking,#mic.speaking{color:var(--acc);border-color:var(--acc-soft)}

  aside{grid-column:2;grid-row:1 / -1;display:flex;flex-direction:column;min-height:0;
    background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--stroke);border-radius:var(--r);overflow:hidden}
  /* v2 project context + Build/Brain grouped nav */
  #projctx{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--stroke)}
  #projSwitch{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:var(--r-pill);border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:var(--txt);font:11px var(--mono);letter-spacing:.1em;cursor:pointer;text-transform:uppercase}
  #projSwitch:hover{border-color:var(--acc-soft);background:var(--acc-tint)}
  #projSwitch .pdot{width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 7px var(--acc-soft)}
  #projSwitch .pcaret{color:var(--faint);font-size:9px}
  #projstat{margin-left:auto;font:9px var(--mono);color:var(--faint);letter-spacing:.08em}
  #projMenu{position:fixed;z-index:70;min-width:210px;background:rgba(22,22,30,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--stroke);border-radius:var(--r);box-shadow:var(--sh-2);padding:6px;font:11px var(--mono)}
  .pmrow{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-sm);color:var(--dim);cursor:pointer;letter-spacing:.08em}
  .pmrow:hover{background:var(--acc-tint);color:var(--txt)}
  .pmrow.on{color:var(--acc)} .pmrow .pmdot{width:6px;height:6px;border-radius:50%;background:var(--faint)} .pmrow.on .pmdot{background:var(--acc)}
  .pmrow.all{border-top:1px solid var(--stroke);margin-top:4px;padding-top:9px}
  #nav{padding:11px 12px;border-bottom:1px solid var(--stroke)}
  .navseg{display:flex;background:var(--panel);border:1px solid var(--stroke);border-radius:var(--r-pill);padding:3px;gap:3px}
  .navm{flex:1;text-align:center;padding:8px 0;border-radius:var(--r-pill);font:11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);cursor:pointer;transition:var(--m2);border:none;background:transparent}
  .navm:hover{color:var(--txt)}
  .navm.on{background:var(--acc);color:var(--bg);font-weight:600}
  .navsubs{margin-top:12px}
  .subset{display:flex;flex-wrap:wrap;gap:6px}
  .subset.hide{display:none}
  #subBuild{background:var(--panel);border:1px solid var(--stroke);border-radius:var(--r-sm);padding:2px;gap:0;flex-wrap:nowrap}
  #subBuild .nt{flex:1;text-align:center;padding:6px 0;border-radius:var(--r-xs);border:none;letter-spacing:.05em}
  #subBuild .nt.on{color:var(--acc-hi);background:var(--acc-tint);box-shadow:inset 0 0 0 1px var(--acc-soft)}
  /* ===== Variant A controller (autobar) ===== */
  #autobar{padding:12px;border-bottom:1px solid var(--stroke)}
  #autobar:empty{display:none;padding:0;border:none}
  .acDeck{background:var(--panel);border:1px solid var(--stroke);border-radius:var(--r-sm);padding:11px}
  .acTop{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .acLabel{font:8px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
  .acStatus{font:9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:inline-flex;align-items:center;gap:6px}
  .acStatus::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
  .acStatus.ok::before{background:var(--ok);box-shadow:0 0 7px var(--ok)}
  .acKill{color:var(--bad);cursor:pointer;font:7.5px var(--mono);letter-spacing:.12em;border:1px solid var(--bad-soft);border-radius:var(--r-pill);padding:2px 7px;text-transform:uppercase}
  .acSA{display:inline-flex;background:var(--bg2);border:1px solid var(--stroke);border-radius:var(--r-pill);padding:2px;margin-left:auto}
  .acSA span{padding:3px 9px;border-radius:var(--r-pill);font:8px var(--mono);letter-spacing:.14em;color:var(--faint);cursor:pointer}
  .acSA span.on{background:var(--acc-tint);color:var(--acc-hi)}
  .acRow{display:flex;align-items:center;gap:9px}
  .acPwr{width:30px;height:30px;border-radius:50%;border:1px solid var(--stroke);background:var(--bg2);color:var(--dim);font-size:13px;display:grid;place-items:center;flex:none;cursor:pointer;transition:var(--m2)}
  .acPwr.on{border-color:var(--ok-soft);background:var(--ok-tint);color:var(--ok)}
  .acMode{flex:1;display:flex;background:var(--bg2);border:1px solid var(--stroke);border-radius:var(--r-pill);padding:2px}
  .acMo{flex:1;text-align:center;padding:6px 0;border-radius:var(--r-pill);font:9px var(--mono);letter-spacing:.08em;color:var(--faint);cursor:pointer}
  .acMo.on{background:var(--acc);color:var(--bg);font-weight:600}
  .acKnobs{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--stroke)}
  .acK{display:flex;align-items:center;gap:7px}
  .acKl{font:8px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .acStep{display:inline-flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--stroke);border-radius:var(--r-sm);padding:3px 8px;font:10px var(--mono)}
  .acStep b{color:var(--acc-hi);cursor:pointer;padding:0 2px}
  .acWarn{color:var(--warn);cursor:help}
  .acChips{display:flex;gap:4px}
  .acChips span{padding:3px 7px;border-radius:var(--r-xs);border:1px solid var(--stroke);font:9px var(--mono);color:var(--faint);cursor:pointer}
  .acChips span.on{color:var(--acc-hi);border-color:var(--acc-soft);background:var(--acc-tint)}
  .acChips.warn span.on{color:var(--warn);border-color:var(--warn-soft);background:var(--warn-tint)}
  .acBurn{font:8px var(--mono);color:var(--warn)}
  .acFocus{background:var(--bg2);border:1px solid var(--stroke);border-radius:var(--r-sm);color:var(--dim);font:9px var(--mono);padding:4px 6px;max-width:150px}
  .acSched{font:9px var(--mono);color:var(--acc-hi);cursor:pointer}
  .acSched:hover{text-decoration:underline}
  .acProg{display:flex;align-items:center;gap:9px;margin-top:10px}
  .acBar{flex:1;height:5px;border-radius:99px;background:var(--bg2);overflow:hidden}
  .acBar i{display:block;height:100%;background:var(--acc)}
  .acPct{font:8px var(--mono);color:var(--faint)}
  .acNote{margin-top:9px;font:10px var(--sans);color:var(--dim);line-height:1.4}
  .acOff .acMode{opacity:.85}
  .acNeeds{border-radius:var(--r-sm);padding:8px 12px;font:9px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-top:9px;cursor:pointer;transition:var(--m2)}
  .acNeeds.warn{background:var(--warn-tint);border:1px solid var(--warn-soft);color:var(--warn-hi)}
  .acNeeds.warn:hover{background:var(--warn-soft)}
  .acNeeds.bad{background:var(--bad-tint);border:1px solid var(--bad-soft);color:var(--bad-hi)}
  .acNeeds.bad:hover{background:var(--bad-soft)}
  .issfilters{display:flex;gap:6px;margin:10px 0 12px}
  .issf{padding:4px 11px;border-radius:var(--r-pill);border:1px solid var(--stroke);font:9px var(--mono);letter-spacing:.08em;color:var(--faint);cursor:pointer;text-transform:uppercase}
  .issf.on{color:var(--acc-hi);border-color:var(--acc-soft);background:var(--acc-tint)}
  .issue{padding:12px;border:1px solid var(--stroke);border-radius:var(--r-sm);margin-bottom:9px;background:var(--panel)}
  .issue[data-status="resolved"]{opacity:.55}
  .isstop{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .issnum{font:9px var(--mono);color:var(--faint)}
  .isstype{font:8px var(--mono);text-transform:uppercase;letter-spacing:.1em;padding:2px 8px;border-radius:var(--r-pill);border:1px solid var(--stroke);color:var(--dim)}
  .isstype.bug{color:var(--bad-hi);border-color:var(--bad-soft)}

  .jnode.done .jwp{color:var(--faint)}.jnode.here .jwp{color:var(--acc)}.jnode.up .jwp{color:var(--faint)}
  .jnode.up{opacity:.5}
  .jsub{font:9px var(--mono);color:var(--faint);margin-top:3px}
  .jlog{margin:3px 0 6px 30px;padding-left:13px;border-left:1px solid var(--stroke)}
  .jle{display:flex;align-items:center;gap:9px;padding:6px 0;font:11px var(--mono);color:var(--dim);border-radius:var(--r-xs)}
  .jle[data-fx]{cursor:pointer}.jle[data-fx]:hover{color:var(--txt)}
  .jle.b{color:var(--txt)}
  .jli{width:15px;text-align:center;flex:none;font-size:11px}
  .jlt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jlx{margin-left:auto;color:var(--faint);font-size:8.5px;flex:none}
  .jmerge{margin:8px 0 2px 30px;font:9px var(--mono);letter-spacing:.08em;color:var(--acc-hi);border:1px solid var(--acc-soft);background:var(--acc-tint);border-radius:var(--r-pill);padding:6px 12px;cursor:pointer}
  .jmerge:hover{background:var(--acc-glow)}
</style>
</head>
<body>
<canvas id="ambient"></canvas>
<div id="reconnect"><span class="rcdot"></span>Reconnecting to Oracle…</div>
<header data-tauri-drag-region>
  <div class="hbub" id="hleft" data-tauri-drag-region>
    <span class="word">O R A C L E</span>
    <span class="dot" id="dot" title="live — violet when connected"></span>
    <span class="hgrow" data-tauri-drag-region></span>
    <button id="agentchip" title="agents at work — click to watch" style="display:none"></button>
    <button id="projbtn" title="projects - overview, make a change, new" aria-label="projects">PROJECTS</button>
    <button id="brainbtn" title="brain — journal, memory, playbooks &amp; more" aria-label="brain">BRAIN</button>
    <button id="modelchip" title="model · context · usage" aria-label="model, context and usage">…</button>
    <span id="stattext" hidden></span>
  </div>
</header>
<main>
  <div id="chatcol">
    <div id="chat"></div>
    <div id="think"></div>
    <div id="wavebar"><canvas id="wave"></canvas><span id="livestat"></span></div>
    <div id="chips"></div>
    <div id="inputrow">
      <textarea id="box" rows="1" placeholder="speak or type — oracle is listening…"></textarea>
      <button id="mic" title="live conversation — ⌥space" aria-label="toggle live voice conversation"><span id="micknob"></span><span id="miclbl">LIVE</span></button>
      <button id="send">SEND</button>
    </div>
  </div>
</main>
<aside>
  <div id="agents"></div>
  <div id="nav">
    <div class="navseg">
      <button class="navm on" id="navBuild" type="button" aria-label="build views">BUILD</button>
      <button class="navm" id="navPlay" type="button" aria-label="play views">PLAY</button>
    </div>
    <div class="navsubs">
      <div class="subset" id="subBuild">
        <div class="nt on" data-p="__fixers__" role="tab" tabindex="0">Fixes</div>
        <div class="nt" data-p="__plan__" role="tab" tabindex="0">Plan</div>
        <div class="nt" data-p="__issues__" role="tab" tabindex="0">Issues</div>
        <div class="nt" data-p="__artifacts__" role="tab" tabindex="0">Artifacts</div>
      </div>
      <div class="subset hide" id="subPlay">
        <div class="nt" data-p="__play__" role="tab" tabindex="0">▶ Play</div>
      </div>
    </div>
  </div>
  <div id="autobar"></div>
  <div id="pane" class="md"></div>
</aside>
<script src="/vendor/marked.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script src="/vendor/vad/ort.min.js"></script>
<script src="/vendor/vad/vad.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
